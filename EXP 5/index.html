<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>Registration Page</title>
 <link rel="stylesheet" href="registration.css">
 <link rel="stylesheet" href="style.css">
</head>
<body>
<table class="website">
 <!-- Row 1: Logo and Website Name -->
 <tr class="top-row">
 <td class="logo-cell"><img src="logo.png" alt="GL Bajaj Logo"></td>
 <td class="site-name">GL Bajaj Online Store</td>
 </tr>
</table>
<!-- Row 2: Menu -->
<table class="website">
 <tr class="menu-row">
 <td><a href="#">Home</a></td>
 <td><a href="#">Login</a></td>
 <td><a href="#">Registration</a></td>
 <td><a href="#">Catalogue</a></td>
 <td><a href="#">Cart</a></td>
 </tr>
</table>
<!-- Registration form -->
<form onsubmit="alert('Registration form submitted!'); return false;">
<table class="website form-table">
 <tr>
 <td colspan="2" class="form-title">Registration Form</td>
 </tr>
 <!-- 1) Name : text field -->
 <tr>
 <td class="label">Name</td>
 <td><input type="text" name="name" required></td>
 </tr>
 <!-- 2) Password : password field -->
 <tr>
 <td class="label">Password</td>
 <td><input type="password" name="password" required></td>
 </tr>
 <!-- 3) E-mail id : text field -->
 <tr>
 <td class="label">E-mail id</td>
 <td><input type="text" name="email" required></td>
 </tr>
 <!-- 4) Phone Number : text field -->
 <tr>
 <td class="label">Phone Number</td>
 <td><input type="text" name="phone" required></td>
 </tr>
 <!-- 5) Sex : radio buttons (same name, so only one can be chosen) -->
 <tr>
 <td class="label">Sex</td>
 <td>
 <input type="radio" name="sex" value="male" checked> Male
 <input type="radio" name="sex" value="female"> Female
 </td>
 </tr>
 <!-- 6) Date of birth : 3 select boxes -->
 <tr>
 <td class="label">Date of Birth</td>
 <td>
 <select name="day">
 <option>Day</option>
 <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
 <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
 <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
 <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
 <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
 <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
 <option>31</option>
 </select>
 <select name="month">
 <option>Month</option>
 <option>Jan</option><option>Feb</option><option>Mar</option><option>Apr</option>
 <option>May</option><option>Jun</option><option>Jul</option><option>Aug</option>
 <option>Sep</option><option>Oct</option><option>Nov</option><option>Dec</option>
 </select>
 <select name="year">
 <option>Year</option>
 <option>1990</option><option>1991</option><option>1992</option><option>1993</option>
 <option>1994</option><option>1995</option><option>1996</option><option>1997</option>
 <option>1998</option><option>1999</option><option>2000</option><option>2001</option>
 <option>2002</option><option>2003</option><option>2004</option><option>2005</option>
 <option>2006</option><option>2007</option><option>2008</option><option>2009</option>
 <option>2010</option>
 </select>
 </td>
 </tr>
 <!-- 7) Languages known : checkboxes -->
 <tr>
 <td class="label">Languages Known</td>
 <td>
 <input type="checkbox" name="lang" value="english" checked> English
 <input type="checkbox" name="lang" value="telugu"> Telugu
 <input type="checkbox" name="lang" value="hindi"> Hindi
 <input type="checkbox" name="lang" value="tamil"> Tamil
 </td>
 </tr>
 <!-- 8) Address : text area -->
 <tr>
 <td class="label">Address</td>
 <td><textarea name="address" rows="4" cols="30"></textarea></td>
 </tr>
 <!-- Buttons -->
 <tr>
 <td></td>
 <td>
 <input type="submit" value="Register">
 <input type="reset" value="Clear">
 </td>
 </tr>
</table>
</form>
</body>
</html>

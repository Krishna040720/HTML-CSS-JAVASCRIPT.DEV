<!DOCTYPE html>
<html>
<head>
 <title>Registration</title>
 <link rel="stylesheet" href="style.css">
</head>
<body class="content">
 <h2>New User Registration</h2>
 <form>
  <p>Full Name: <input type="text" style="padding: 4px;"></p>
  <p>Email Address: <input type="email" style="padding: 4px;"></p>
  <p>Password: <input type="password" style="padding: 4px;"></p>
  <p>Department: 
    <select style="padding: 4px;">
      <option>CSE</option>
      <option>ECE</option>
      <option>EEE</option>
      <option>CIVIL</option>
      <option>MECHANICAL</option>
    </select>
  </p>
  <p><button type="button" style="padding: 6px 14px;">Register</button></p>
 </form>
</body>
</html>
